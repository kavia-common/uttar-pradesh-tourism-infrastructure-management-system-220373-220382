# Server configuration
server.port=3001
# Bind to all interfaces so container orchestrators can reach the service
server.address=0.0.0.0

# Database: H2 file-based for dev usage
spring.datasource.url=jdbc:h2:file:/home/kavia/workspace/code-generation/uttar-pradesh-tourism-infrastructure-management-system-220373-220382/spring_backend/data/h2db;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (useful in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoints for health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
